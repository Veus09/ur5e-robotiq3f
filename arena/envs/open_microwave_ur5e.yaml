env_name: ur5e_open_microwave
embodiment:
  id: ur5e
  registry_name: ur5e_3f_ik_abs
  params:
    pedestal_height_m: 0.8
background:
  id: kitchen
  registry_name: lightwheel_kitchen_one_wall_coastal
  params: {}
objects: []
object_references:
- id: floor
  parent_id: kitchen
  prim_path: floor_room/geometry
  object_type: base
  params: {}
- id: microwave
  parent_id: kitchen
  prim_path: microwave_main_group
  object_type: articulation
  params:
    openable_joint_name: microjoint
relations:
- kind: is_anchor
  subject: floor
  params: {}
- kind: is_anchor
  subject: microwave
  params: {}
- kind: 'on'
  subject: ur5e
  reference: floor
  params: {}
- kind: next_to
  subject: ur5e
  reference: microwave
  params:
    side: negative_y
    distance_m: 0.3
- kind: rotate_around_solution
  subject: ur5e
  params:
    yaw_rad: 1.57
task:
  composition: atomic
  description: open the microwave door
  subtasks:
  - kind: OpenDoorTask
    params:
      openable_object: microwave
      openness_threshold: 0.1
      reset_openness: 0.0
